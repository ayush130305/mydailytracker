<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Console</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2540ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm grid of single-purpose cards under a countdown strip; mono for numbers, sans for text */
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#111318; --mute:#667085; --line:#e2e5ea;
  --acc:#2540ff; --acc-soft:#e8ecff; --ok:#13795b;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --card:#16191e; --ink:#eceef2; --mute:#8b93a1; --line:#262b33;
    --acc:#7d90ff; --acc-soft:#1d2340; --ok:#4cc9a0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --card:#16191e; --ink:#eceef2; --mute:#8b93a1; --line:#262b33;
  --acc:#7d90ff; --acc-soft:#1d2340; --ok:#4cc9a0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 56px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{margin:0;font:600 28px/1.15 var(--sans);text-wrap:balance}
.sub{font:400 13px var(--mono);color:var(--mute);margin-top:6px}
.sum{font:500 13px var(--mono);color:var(--mute)}
.cds{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:22px 0 12px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.cd .n{font:600 34px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.cd .l{font-weight:500}
.cd .d{font:400 12px var(--mono);color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:500 13px var(--sans);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.tiny{padding:3px 8px;font-size:12px;color:var(--mute)}
.chip{font:500 12px var(--mono);border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:400 14px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:64px}
.grow{flex:1 1 120px}
.timer{font:500 56px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s linear}
.muted{color:var(--mute)}
.mono{font-family:var(--mono)}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{color:var(--mute);text-decoration:line-through}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--mute);background:transparent;cursor:pointer;flex:none;padding:0;color:#fff;font:600 12px var(--mono);line-height:1}
.box.on{background:var(--acc);border-color:var(--acc)}
.x{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:16px;padding:0 4px}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--acc)}
.streak{font:500 12px var(--mono);color:var(--mute);min-width:34px;text-align:right}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px}
.track{height:96px;width:100%;display:flex;align-items:flex-end}
.track i{display:block;width:100%;background:var(--line);border-radius:4px 4px 0 0;min-height:2px}
.col.today .track i{background:var(--acc)}
.col .bv{font:400 11px var(--mono);color:var(--mute);height:14px}
.col .bl{font:500 11px var(--mono);color:var(--mute)}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font:400 12px var(--mono);color:var(--mute)}
.stats b{color:var(--ink);font-weight:500}
.q{font-weight:500}
.ans{border-left:2px solid var(--acc);padding-left:10px;color:var(--ink)}
.cat{display:flex;align-items:center;gap:8px;font:400 12px var(--mono);color:var(--mute)}
.cat .nm{width:78px}
.cat .bb{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.cat .bb i{display:block;height:100%;background:var(--acc)}
.cat .am{width:70px;text-align:right;color:var(--ink)}
.big{font:600 26px var(--mono);font-variant-numeric:tabular-nums}
footer{margin-top:20px;font:400 12px var(--mono);color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hide{display:none}
.tabs{margin:12px 0;gap:6px}
.wi{display:flex;flex-direction:column;gap:6px;min-width:0}
.wi>.card{flex:1}
@media (min-width:760px){.wi.s2{grid-column:span 2}}
.editing .wi{outline:1px dashed var(--line);outline-offset:4px;border-radius:12px}
.wi.over{outline:2px solid var(--acc)}
.wi.drag{opacity:.45}
.wbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grip{cursor:grab;color:var(--mute);font-size:18px;line-height:1;padding:0 4px;user-select:none}
.wn{font:500 12px var(--mono);color:var(--mute);flex:1;min-width:80px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.gi{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn:disabled{opacity:.45;cursor:default}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kcol{background:var(--bg);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:90px}
.kh{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--mute)}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.kb{display:flex;justify-content:flex-end}
.week.w8{grid-template-columns:repeat(8,1fr)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--line)}
.heat i.fut{background:transparent}
.heat i.l1{background:color-mix(in srgb,var(--acc) 25%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--acc) 50%,var(--line))}
.heat i.l3{background:color-mix(in srgb,var(--acc) 75%,var(--line))}
.heat i.l4{background:var(--acc)}
.lk{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px}
.lk a{color:var(--acc);text-decoration:none;font-weight:500}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="greet"></h1>
      <div class="sub" id="dateLine"></div>
    </div>
    <div class="row"><div class="sum" id="summary"></div><button class="btn" data-act="customize" id="custBtn">Customize</button></div>
  </header>

  <section class="cds" id="cds" aria-label="Countdowns"></section>
  <div class="row" id="cdRow" style="margin-bottom:12px"><button class="btn tiny" data-act="edit-cd" id="cdEditBtn">Edit dates</button><button class="btn tiny hide" data-act="add-cd" id="cdAddBtn">Add date</button></div>

  <nav class="row tabs" id="tabs"></nav>
  <div class="row hide" id="pageTools" style="margin-bottom:12px"></div>
  <section class="card hide" id="gallery" style="margin-bottom:12px"></section>
  <main class="grid" id="grid"></main>

  <footer>
    <span id="status">Loading</span>
    <span id="ver"></span>
  </footer>
</div>

<script>
const BUILD = '2026-11-17-c';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMin = m => m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm';
const fmtMoney = n => '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const box = id => ({ set innerHTML(v) { const e = document.getElementById(id); if (e) e.innerHTML = v; } });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const CATS = ['Food', 'Travel', 'Components', 'Running', 'Study', 'Other'];

/* ---------- state ---------- */
const DEFAULT = {
  settings: {
    focus: 50, brk: 10, lastSubject: 'RTL', lastCat: 'Food',
    tags: ['RTL', 'Intern', 'Reading', 'Other'],
    habits: [
      { id: 'h1', name: 'Run or move' },
      { id: 'h4', name: 'RTL / Verilog' },
      { id: 'h5', name: 'Read 20 min' },
      { id: 'h6', name: 'Sleep by midnight' }
    ],
    dates: [
      { id: 'd2', label: 'New Year trip', date: '2026-12-29' },
      { id: 'd3', label: 'Graduation', date: '2027-05-31' }
    ],
    sync: { repo: 'ayush130305/mydailytracker-data', path: 'data/state.json', branch: 'main' }
  },
  layout: { cur: 0, pages: [
    { id: 'p1', name: 'Today', widgets: [{ id: 'focus', type: 'focus', size: 1 }, { id: 'tasks', type: 'tasks', size: 1 }, { id: 'habits', type: 'habits', size: 1 }, { id: 'week', type: 'week', size: 1 }, { id: 'log', type: 'log', size: 1 }, { id: 'drill', type: 'drill', size: 1 }] },
    { id: 'p2', name: 'Plan', widgets: [{ id: 'board1', type: 'board', size: 2 }, { id: 'ideas1', type: 'ideas', size: 1 }, { id: 'review1', type: 'review', size: 1 }, { id: 'links1', type: 'links', size: 1 }, { id: 'pad1', type: 'pad', size: 1 }] },
    { id: 'p3', name: 'Track', widgets: [{ id: 'money', type: 'money', size: 1 }, { id: 'counters1', type: 'counters', size: 1 }, { id: 'runs1', type: 'runs', size: 1 }, { id: 'heat1', type: 'heat', size: 1 }, { id: 'watch1', type: 'watch', size: 1 }, { id: 'clocks1', type: 'clocks', size: 1 }] },
    { id: 'p4', name: 'Settings', widgets: [{ id: 'sync', type: 'sync', size: 1 }] }
  ] },
  wd: {},
  days: {}, expenses: [], drill: { date: '', i: 0 }, savedAt: 0
};
let S = structuredClone(DEFAULT);
let editCD = false, editH = false, editT = false, editL = false, showAns = false;

function merge(r) {
  const base = structuredClone(DEFAULT);
  if (!r || typeof r !== 'object') return base;
  const out = Object.assign(base, r);
  out.settings = Object.assign(structuredClone(DEFAULT.settings), r.settings || {});
  if (!Array.isArray(out.settings.habits)) out.settings.habits = structuredClone(DEFAULT.settings.habits);
  if (!Array.isArray(out.settings.dates)) out.settings.dates = structuredClone(DEFAULT.settings.dates);
  if (!Array.isArray(out.settings.tags) || !out.settings.tags.length) out.settings.tags = structuredClone(DEFAULT.settings.tags);
  out.settings.sync = Object.assign({}, DEFAULT.settings.sync, r.settings && r.settings.sync);
  const L = r.layout;
  out.layout = (L && Array.isArray(L.pages) && L.pages.length && L.pages.every(p => Array.isArray(p.widgets))) ? L : structuredClone(DEFAULT.layout);
  if (typeof out.layout.cur !== 'number') out.layout.cur = 0;
  if (!out.wd || typeof out.wd !== 'object') out.wd = {};
  if (!out.days || typeof out.days !== 'object') out.days = {};
  if (!Array.isArray(out.expenses)) out.expenses = [];
  if (!out.drill) out.drill = { date: '', i: 0 };
  return out;
}

const getDay = d => S.days[d] || { tasks: [], habits: {}, focus: {}, log: '', drills: 0 };
const dayW = (d = todayISO()) => {
  if (!S.days[d]) S.days[d] = { tasks: [], habits: {}, focus: {}, log: '', drills: 0 };
  const x = S.days[d];
  x.tasks = x.tasks || []; x.habits = x.habits || {}; x.focus = x.focus || {};
  return x;
};
const focusSum = d => Object.values(d.focus || {}).reduce((a, b) => a + b, 0);

/* ---------- persistence: account database when available, this device otherwise ---------- */
const LS = 'daily-console-v1';
let dbRef = null, saveT = null;
const loadLocal = () => { try { const r = localStorage.getItem(LS); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
function setStatus(t) { $('#status').textContent = t; }
function save() {
  S.savedAt = Date.now();
  saveLocal();
  setStatus('Saving');
  clearTimeout(saveT);
  saveT = setTimeout(flush, 800);
}
async function flush() {
  if (getTok()) { clearTimeout(ghT); ghT = setTimeout(ghPush, 3000); }
  if (!dbRef) { if (!getTok()) setStatus('Saved on this device'); return; }
  try { await dbRef.set({ json: JSON.stringify(S), updated: Date.now() }); setStatus('Saved to your account'); }
  catch (e) { setStatus('Saved on this device'); }
}

/* ---------- GitHub sync: keeps one JSON file in your repo so phone and laptop share data ---------- */
const TK = 'dc-gh-token';
const getTok = () => { try { return localStorage.getItem(TK) || ''; } catch (e) { return ''; } };
let ghSha = null, ghT = null;
const ghUrl = () => 'https://api.github.com/repos/' + S.settings.sync.repo + '/contents/' + S.settings.sync.path;
const ghHead = () => ({ Authorization: 'Bearer ' + getTok(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' });
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = b => decodeURIComponent(escape(atob(b.replace(/\n/g, ''))));
async function ghPull() {
  const r = await fetch(ghUrl() + '?ref=' + S.settings.sync.branch + '&t=' + Date.now(), { headers: ghHead(), cache: 'no-store' });
  if (r.status === 404) { ghSha = null; return null; }
  if (!r.ok) throw new Error('GitHub ' + r.status);
  const j = await r.json(); ghSha = j.sha;
  return JSON.parse(b64dec(j.content));
}
async function ghPush(retry = true) {
  if (!getTok()) return;
  try {
    const body = { message: 'Update tracker data', content: b64enc(JSON.stringify(S, null, 1)), branch: S.settings.sync.branch };
    if (ghSha) body.sha = ghSha;
    const r = await fetch(ghUrl(), { method: 'PUT', headers: ghHead(), body: JSON.stringify(body) });
    if (r.ok) { ghSha = (await r.json()).content.sha; setStatus('Synced to GitHub'); }
    else if ((r.status === 409 || r.status === 422) && retry) { await ghPull(); await ghPush(false); }
    else setStatus('GitHub sync failed (' + r.status + '). Saved on this device.');
  } catch (e) { setStatus('Offline. Saved on this device.'); }
}
async function syncNow() {
  if (!getTok()) return;
  setStatus('Syncing');
  try {
    const remote = await ghPull();
    if (remote && (remote.savedAt || 0) > (S.savedAt || 0)) { S = merge(remote); saveLocal(); renderAll(); setStatus('Synced from GitHub'); }
    else await ghPush();
  } catch (e) { setStatus('GitHub sync failed. Check the token.'); }
}
function exportData() { const b = $('#dataBox'); b.value = JSON.stringify(S); b.select(); try { navigator.clipboard.writeText(b.value); } catch (e) {} setStatus('Backup text ready to copy'); }
function importData() {
  try { const r = JSON.parse($('#dataBox').value); S = merge(r); S.savedAt = Date.now(); save(); renderAll(); setStatus('Backup loaded'); }
  catch (e) { setStatus('That text is not a valid backup'); }
}
function renderSync() {
  const on = !!getTok(), s = S.settings.sync;
  box('cSync').innerHTML = `
    <h2><span>Sync and backup</span><span>${on ? 'GitHub on' : 'This device only'}</span></h2>
    <div class="muted" style="font-size:13px">Data repo below should be private, because this repo is public. Paste a GitHub token with Contents read/write on it on each device. It stays in this browser and is never saved into your data.</div>
    <div class="row"><input class="grow" data-repo="1" value="${esc(s.repo)}" aria-label="Data repository (owner/name)" placeholder="owner/private-data-repo"></div>
    <div class="row"><input class="grow" id="ghTok" type="password" placeholder="${on ? 'Token saved' : 'github_pat_…'}" aria-label="GitHub token" autocomplete="off"><button class="btn pri" data-act="sync-token">Save</button>${on ? '<button class="btn" data-act="sync-now">Sync now</button><button class="btn tiny" data-act="sync-clear">Remove</button>' : ''}</div>
    <div class="row"><button class="btn" data-act="export">Export backup</button><button class="btn" data-act="import">Import backup</button></div>
    <textarea id="dataBox" placeholder="Backup text appears here. Paste a backup and press Import to restore." aria-label="Backup text"></textarea>`;
}
async function initDb() {
  try {
    if (!window.claude || !claude.use) { setStatus('Saved on this device'); return; }
    const db = await claude.use('db');
    const user = await claude.use('user');
    if (!db || !user) { setStatus('Saved on this device'); return; }
    const id = await user.id();
    const ref = db.collection('data/users/' + id).doc('state');
    const snap = await ref.get();
    let d = snap && (typeof snap.data === 'function' ? snap.data() : snap.data);
    dbRef = ref;
    if (d && d.json) {
      const remote = merge(JSON.parse(d.json));
      if ((remote.savedAt || 0) >= (S.savedAt || 0)) { S = remote; saveLocal(); renderAll(); setStatus('Saved to your account'); }
      else { flush(); }
    } else { flush(); }
  } catch (e) { setStatus('Saved on this device'); }
}

/* ---------- header and countdowns ---------- */
function renderHeader() {
  const n = new Date(), h = n.getHours();
  const g = h < 5 ? 'Still up, Ayush' : h < 12 ? 'Good morning, Ayush' : h < 17 ? 'Good afternoon, Ayush' : 'Good evening, Ayush';
  $('#greet').textContent = g;
  $('#dateLine').textContent = n.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const d = getDay(todayISO());
  const hd = S.settings.habits.filter(x => d.habits[x.id]).length;
  const td = d.tasks.filter(t => t.done).length;
  $('#summary').textContent = hd + '/' + S.settings.habits.length + ' habits · ' + td + '/' + d.tasks.length + ' tasks · ' + fmtMin(focusSum(d)) + ' focused';
}
function renderCD() {
  const t0 = new Date(todayISO() + 'T00:00:00');
  $('#cdEditBtn').textContent = editCD ? 'Done' : (S.settings.dates.length ? 'Edit dates' : 'Add a date');
  $('#cdAddBtn').classList.toggle('hide', !editCD);
  $('#cds').innerHTML = S.settings.dates.map((c, i) => {
    if (editCD) return `<div class="cd"><input data-cd="${i}" data-f="label" value="${esc(c.label)}" aria-label="Label"><input type="date" data-cd="${i}" data-f="date" value="${esc(c.date)}" aria-label="Date"><button class="btn tiny" data-act="del-cd" data-i="${i}">Remove</button></div>`;
    const days = Math.round((new Date(c.date + 'T00:00:00') - t0) / 864e5);
    const big = isNaN(days) ? '—' : days < 0 ? 'Done' : days;
    const unit = isNaN(days) || days < 0 ? '' : days === 1 ? 'day left' : 'days left';
    return `<div class="cd"><span class="n">${big}</span><span class="l">${esc(c.label)}</span><span class="d">${unit ? unit + ' · ' : ''}${esc(c.date)}</span></div>`;
  }).join('');
}

/* ---------- focus timer ---------- */
let T = { mode: 'focus', end: null, start: null, mins: 0, subject: 'RTL' };
try { const r = JSON.parse(localStorage.getItem('dc-timer') || 'null'); if (r) T = Object.assign(T, r); } catch (e) {}
const saveT_ = () => { try { localStorage.setItem('dc-timer', JSON.stringify(T)); } catch (e) {} };
let actx = null;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(o => {
      const os = actx.createOscillator(), g = actx.createGain();
      os.frequency.value = 880; os.connect(g); g.connect(actx.destination);

function copyExpenses() {
  const rows = monthRows().slice().reverse();
  const tsv = ['Date\tCategory\tNote\tAmount'].concat(rows.map(r => [r.date, r.cat, r.note, r.amt].join('\t'))).join('\n');
  const box = $('#tsvBox');
  const fallback = () => { box.value = tsv; box.classList.remove('hide'); box.focus(); box.select(); };
  try { navigator.clipboard.writeText(tsv).then(() => setStatus('Copied ' + rows.length + ' rows'), fallback); } catch (e) { fallback(); }
}

/* ---------- widget system: catalog, layout, drag and drop ---------- */
const wdata = w => S.wd[w.id] || (S.wd[w.id] = CAT[w.type].init());
const wEl = w => document.getElementById('w-' + w.id);
const findInst = id => { for (const p of S.layout.pages) { const w = p.widgets.find(x => x.id === id); if (w) return w; } return null; };
const refresh = id => { const w = findInst(id); if (w) CAT[w.type].fill(w); };
const weekStart = () => addDays(todayISO(), -((new Date().getDay() + 6) % 7));
const fmtPace = p => { if (!isFinite(p) || p <= 0) return '–'; let m = Math.floor(p), s = Math.round((p - m) * 60); if (s === 60) { m++; s = 0; } return m + ':' + pad(s) + ' /km'; };
const head = (t, r) => `<h2><span>${t}</span><span>${r === undefined ? '' : r}</span></h2>`;
const curPage = () => { const L = S.layout; if (L.cur >= L.pages.length) L.cur = 0; return L.pages[L.cur]; };
const placed = t => S.layout.pages.some(p => p.widgets.some(w => w.type === t));
const delItem = (el, key) => { const w = findInst(el.dataset.w), dd = wdata(w); dd[key] = dd[key].filter(x => x.id !== el.dataset.id); save(); refresh(w.id); };
const A = (w, extra) => `data-w="${w.id}" ${extra || ''}`;

function renderTabs() {
  const L = S.layout; if (L.cur >= L.pages.length) L.cur = 0;
  let h = L.pages.map((p, i) => `<button class="chip ${i === L.cur ? 'on' : ''}" data-act="page" data-i="${i}">${esc(p.name)}</button>`).join('');
  if (editL) h += '<button class="chip" data-act="page-add">+ Page</button>';
  $('#tabs').innerHTML = h;
  $('#tabs').classList.toggle('hide', L.pages.length < 2 && !editL);
  const t = $('#pageTools'); t.classList.toggle('hide', !editL);
  if (editL) t.innerHTML = `<input data-pn="1" value="${esc(curPage().name)}" aria-label="Page name">${L.pages.length > 1 ? '<button class="btn tiny" data-act="page-del">Delete this page</button>' : ''}<span class="muted" style="font-size:12px">Drag a widget by its handle, or use the arrows.</span>`;
  $('#custBtn').textContent = editL ? 'Done' : 'Customize';
}
function renderGrid() {
  const pg = curPage();
  $('#grid').innerHTML = pg.widgets.map((w, i) => {
    const c = CAT[w.type]; if (!c) return '';
    const id = c.el || ('w-' + w.id), sz = w.size || c.size || 1;
    const bar = editL ? `<div class="wbar"><span class="grip" title="Drag to move">⠿</span><span class="wn">${esc(c.name)}</span><button class="btn tiny" data-act="w-left" data-i="${i}" aria-label="Move earlier">‹</button><button class="btn tiny" data-act="w-right" data-i="${i}" aria-label="Move later">›</button><button class="btn tiny" data-act="w-size" data-i="${i}">${sz === 2 ? 'Narrow' : 'Wide'}</button><button class="btn tiny" data-act="w-del" data-i="${i}">Remove</button></div>` : '';
    return `<div class="wi s${sz}" data-wid="${w.id}" ${editL ? 'draggable="true"' : ''}>${bar}<section class="card" id="${id}"></section></div>`;
  }).join('') || '<div class="muted">This page is empty. Press Customize, then add a widget.</div>';
  document.body.classList.toggle('editing', editL);
  pg.widgets.forEach(w => { const c = CAT[w.type]; if (c) c.fill(w); });
  updClocks();
}
function renderGallery() {
  const g = $('#gallery'); g.classList.toggle('hide', !editL);
  if (!editL) return;
  g.innerHTML = head('Add a widget', 'to “' + esc(curPage().name) + '”') + `<div class="gal">${Object.entries(CAT).map(([t, c]) => { const used = c.single && placed(t); return `<div class="gi"><div><b>${esc(c.name)}</b><div class="muted" style="font-size:12px">${esc(c.desc)}</div></div><button class="btn" ${used ? 'disabled' : ''} data-act="g-add" data-t="${t}">${used ? 'Placed' : 'Add'}</button></div>`; }).join('')}</div>`;
}

let dragId = null;
document.addEventListener('dragstart', e => {
  const w = e.target.closest && e.target.closest('.wi'); if (!w || !editL) return;
  dragId = w.dataset.wid; e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {}
  w.classList.add('drag');
});
document.addEventListener('dragover', e => {
  if (!dragId) return; const w = e.target.closest && e.target.closest('.wi'); if (!w) return;
  e.preventDefault();
  document.querySelectorAll('.wi.over').forEach(x => x.classList.remove('over'));
  if (w.dataset.wid !== dragId) w.classList.add('over');
});
document.addEventListener('drop', e => {
  if (!dragId) return; const w = e.target.closest && e.target.closest('.wi'); if (!w) return;
  e.preventDefault();
  const ws = curPage().widgets, from = ws.findIndex(x => x.id === dragId), to = ws.findIndex(x => x.id === w.dataset.wid);
  if (from >= 0 && to >= 0 && from !== to) { const [m] = ws.splice(from, 1); ws.splice(to, 0, m); save(); }
  dragId = null; renderGrid();
});
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.wi.drag,.wi.over').forEach(x => x.classList.remove('drag', 'over')); });

/* ---------- widget: weekly review ---------- */
function wReview(w) {
  const d = wdata(w), wk = weekStart(), today = todayISO(), days = [...Array(7)].map((_, i) => addDays(today, i - 6));
  const foc = days.reduce((a, x) => a + focusSum(getDay(x)), 0);
  const hs = S.settings.habits, hits = days.reduce((a, x) => a + hs.filter(h => getDay(x).habits[h.id]).length, 0);
  const pct = hs.length ? Math.round(hits / (hs.length * 7) * 100) : 0;
  const tk = days.reduce((a, x) => a + getDay(x).tasks.filter(t => t.done).length, 0);
  const sp = S.expenses.filter(e => e.date >= days[0] && e.date <= today).reduce((a, e) => a + e.amt, 0);
  const n = d.weeks[wk] || {};
  const P = [['a', 'What went well'], ['b', 'What slipped'], ['c', 'One focus for next week']];
  wEl(w).innerHTML = head('Weekly review', 'week of ' + wk.slice(8) + '/' + wk.slice(5, 7)) + `
    <div class="stats"><span>Focus <b>${fmtMin(foc)}</b></span><span>Habits <b>${pct}%</b></span><span>Tasks done <b>${tk}</b></span><span>Spent <b>${fmtMoney(sp)}</b></span></div>
    ${P.map(([k, l]) => `<label class="muted" style="font-size:12px">${l}</label><textarea style="min-height:48px" data-wnote="${k}" ${A(w)} aria-label="${l}">${esc(n[k] || '')}</textarea>`).join('')}`;
}

/* ---------- widget: run log ---------- */
function wRuns(w) {
  const d = wdata(w), t = todayISO(), s30 = addDays(t, -29), ws = weekStart();
  const km = (a, b) => d.runs.filter(r => r.date >= a && r.date <= b).reduce((x, r) => x + r.km, 0);
  const r30 = d.runs.filter(r => r.date >= s30 && r.date <= t), timed = r30.filter(r => r.min > 0);
  const pace = timed.reduce((a, r) => a + r.min, 0) / (timed.reduce((a, r) => a + r.km, 0) || 1);
  const longest = r30.reduce((x, r) => Math.max(x, r.km), 0);
  const monthKm = d.runs.filter(r => r.date.startsWith(t.slice(0, 7))).reduce((a, r) => a + r.km, 0);
  const bars = [...Array(8)].map((_, i) => { const a = addDays(ws, -7 * (7 - i)); return [a, km(a, addDays(a, 6))]; });
  const mx = Math.max(10, ...bars.map(b => b[1]));
  const rows = d.runs.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);
  wEl(w).innerHTML = head('Run log', km(ws, t).toFixed(1) + ' km this week') + `
    <div class="week w8">${bars.map((b, i) => `<div class="col ${i === 7 ? 'today' : ''}"><span class="bv">${b[1] ? Math.round(b[1]) : ''}</span><div class="track"><i style="height:${b[1] / mx * 100}%"></i></div><span class="bl">${b[0].slice(8)}</span></div>`).join('')}</div>
    <div class="stats"><span>Month <b>${monthKm.toFixed(1)} km</b></span><span>Avg pace <b>${fmtPace(pace)}</b></span><span>Longest (30d) <b>${longest.toFixed(1)} km</b></span></div>
    <form class="row" data-form="r-add" ${A(w)}><input name="km" type="number" step="any" min="0" placeholder="km" style="width:70px" aria-label="Distance in km" required><input name="min" type="number" step="any" min="0" placeholder="min" style="width:70px" aria-label="Minutes"><input class="grow" name="note" placeholder="Note" aria-label="Note"><button class="btn pri" type="submit">Log</button></form>
    <div class="list">${rows.map(r => `<div class="item"><span class="mono muted" style="font-size:12px;width:44px">${r.date.slice(8)}/${r.date.slice(5, 7)}</span><span class="t">${r.km} km${r.min ? ' · ' + fmtPace(r.min / r.km) : ''}${r.note ? ' · ' + esc(r.note) : ''}</span><button class="x" data-act="r-del" ${A(w, `data-id="${r.id}"`)} aria-label="Delete">×</button></div>`).join('')}</div>`;
}

/* ---------- widget: streak heatmap ---------- */
function wHeat(w) {
  const d = wdata(w), today = todayISO(), start = addDays(weekStart(), -25 * 7);
  const test = d.src === 'focus' ? (x => focusSum(getDay(x)) >= 25) : (x => getDay(x).habits[d.src]);
  const lvl = x => { if (x > today) return 'fut'; if (d.src === 'focus') { const m = focusSum(getDay(x)); return m >= 120 ? 'l4' : m >= 60 ? 'l3' : m >= 25 ? 'l2' : m > 0 ? 'l1' : ''; } return getDay(x).habits[d.src] ? 'l4' : ''; };
  const cells = [...Array(182)].map((_, i) => { const x = addDays(start, i); return `<i class="${lvl(x)}" title="${x}"></i>`; }).join('');
  const opts = [['focus', 'Focus (25 min or more)']].concat(S.settings.habits.map(h => [h.id, h.name]));
  wEl(w).innerHTML = head('Streak heatmap', streak(test) + 'd streak') + `
    <select data-hs="1" ${A(w)} aria-label="Heatmap source">${opts.map(o => `<option value="${esc(o[0])}" ${o[0] === d.src ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>
    <div class="heat" aria-hidden="true">${cells}</div><div class="muted mono" style="font-size:11px">Last 26 weeks, oldest on the left</div>`;
}

function wForm(kind, form) {
  const id = form.dataset.w, w = findInst(id); if (!w) return;
  const d = wdata(w), fd = new FormData(form), g = k => String(fd.get(k) || '').trim();
  if (kind === 'b-add' && g('t')) d.cards.push({ id: uid(), t: g('t'), col: 0 });
  else if (kind === 'i-add' && g('t')) d.items.unshift({ id: uid(), t: g('t'), ts: Date.now() });
  else if (kind === 'c-add' && g('name')) d.items.push({ id: uid(), name: g('name'), goal: parseFloat(g('goal')) || 0, step: parseFloat(g('step')) || 1 });
  else if (kind === 'r-add') { const km = parseFloat(g('km')), min = parseFloat(g('min')); if (!(km > 0)) return; d.runs.push({ id: uid(), date: todayISO(), km, min: min > 0 ? min : 0, note: g('note') }); }
  else if (kind === 'wl-add' && g('sym')) d.items.push({ id: uid(), sym: g('sym').toUpperCase(), target: g('target'), note: g('note'), hit: false });
  else if (kind === 'l-add' && g('url')) { let u = g('url'); if (!/^https?:\/\//i.test(u)) u = 'https://' + u; d.items.push({ id: uid(), label: g('label') || u.replace(/^https?:\/\//, ''), url: u }); }
  else if (kind === 'z-add' && g('tz') && !d.zones.includes(g('tz'))) d.zones.push(g('tz'));
  else return;
  save(); refresh(id);
}

setInterval(updClocks, 1000);

/* ---------- boot ---------- */
const local = loadLocal(); if (local) S = merge(local);
renderAll();
setStatus('Saved on this device');
if (T.end && T.end <= Date.now()) finishTimer();
setInterval(tick, 500);
let lastDay = todayISO();
setInterval(() => { const t = todayISO(); if (t !== lastDay) { lastDay = t; showAns = false; renderAll(); } }, 60000);
initDb();
if (getTok()) syncNow();
document.addEventListener('visibilitychange', () => { if (!document.hidden && getTok() && !T.end) syncNow(); });
$('#ver').textContent = 'Saved as you go · build ' + BUILD;
try {
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const had = !!navigator.serviceWorker.controller; let rl = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !rl) { rl = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
  }
} catch (e) {}
</script>
